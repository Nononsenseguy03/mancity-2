<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manchester City Exclusive Access</title>
  <style>
    body {
      background-color: #6CABDD;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 40px;
    }

    .logo {
      width: 150px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    input, button {
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      margin: 5px;
    }

    input {
      width: 250px;
    }

    button {
      background-color: #00285E;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #001f47;
    }
  </style>
</head>
<body>

  <img src="https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg" alt="Man City Crest" class="logo" />

  <h1>Manchester City Insider Access</h1>
  <p>Enter the exclusive access code for behind-the-scenes content.</p>

  <input type="text" id="password" placeholder="Enter code..." />
  <button onclick="checkPassword()">Unlock</button>

  <script>
    function normalize(str) {
      return str.toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9]/g, '');
    }

    function checkPassword() {
      const input = document.getElementById('password').value;
      const cleaned = normalize(input);
      const accepted = ['proverbs1717'];

      if (accepted.includes(cleaned)) {
        // 🔁 Redirect instead of revealing link
        window.location.href = "YOUR_DRIVE_LINK_HERE";
      } else {
        alert('Incorrect code. Try again.');
      }
    }
  </script>

</body>
</html>
